<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chat Cancillería</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #ffffff;
  margin: 0;
  padding: 0;
}

/* CONTENEDOR CHAT */

.chat-widget {
  width: 380px;
  height: 640px;
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0px 10px 30px rgba(0,0,0,0.2);
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #f5f6fa;
  display: flex;
  flex-direction: column;
}

/* HEADER */

.chat-header {
  background: #5548f4;
  padding: 15px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.chat-header-left {
  display: flex;
  align-items: center;
}

.chat-logo {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  margin-right: 10px;
}

.chat-title {
  font-size: 16px;
  font-weight: bold;
}

.chat-subtitle {
  font-size: 12px;
  opacity: 0.9;
}

.chat-buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.chat-buttons button {
  background: rgba(255,255,255,0.2);
  border: none;
  color: white;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
}

.close-btn {
  font-size: 20px;
  cursor: pointer;
}

/* BODY */

.chat-body {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
}

/* MENSAJE BOT */

.bot-message {
  background: white;
  padding: 14px;
  border-radius: 14px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  max-width: 95%;
}

.bot-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
}

.bot-content strong {
  display: block;
  margin-bottom: 6px;
}

/* BOTON INICIO */

.start-btn {
  margin-top: 12px;
  background: #ffc107;
  border: none;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

/* FOOTER */

.chat-footer {
  padding: 10px;
  display: flex;
  gap: 10px;
  background: #ffffff;
  border-top: 1px solid #ddd;
}

.chat-footer input {
  flex: 1;
  border-radius: 20px;
  border: 1px solid #ccc;
  padding: 10px 15px;
  outline: none;
}

.send-btn {
  background: #5548f4;
  border: none;
  color: white;
  border-radius: 50%;
  width: 42px;
  height: 42px;
  cursor: pointer;
  font-size: 18px;
}

</style>
</head>

<body>

<div class="chat-widget">

  <!-- HEADER -->
  <div class="chat-header">

    <div>
      <div class="chat-header-left">
        <img class="chat-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Escudo_de_Colombia.svg/512px-Escudo_de_Colombia.svg.png">
        <div>
          <div class="chat-title">Cancillería</div>
          <div class="chat-subtitle">Ministerio de Relaciones Exteriores</div>
        </div>
      </div>

      <div class="chat-buttons">
        <button onclick="resetChat()">Inicio</button>
        <button onclick="resetChat()">Reset</button>
      </div>
    </div>

    <div class="close-btn">×</div>

  </div>

  <!-- BODY -->
  <div class="chat-body" id="chatBody">

    <div class="bot-message">

      <img class="bot-avatar" src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

      <div class="bot-content">
        <strong>MINISTERIO DE RELACIONES EXTERIORES</strong>

        Hola soy <b>Abril</b>, la nueva asistente virtual del
        <b>Ministerio de Relaciones Exteriores de Colombia</b>
        y estoy disponible para ayudarle y mejorar su experiencia de trámite.

        <br>

        <button class="start-btn">¡Iniciar aquí! 🚀</button>
      </div>

    </div>

  </div>

  <!-- FOOTER -->
  <div class="chat-footer">
    <input type="text" placeholder="Escribe tu mensaje...">
    <button class="send-btn">➤</button>
  </div>

</div>

<script>

function resetChat() {
  location.reload();
}

</script>

</body>
</html>
